<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Deep Space Sky Background v3</title>
<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

.sky{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
    radial-gradient(ellipse at 15% 20%,rgba(180,225,255,.35),transparent 35%),
    linear-gradient(
        180deg,
        #78b9e6 0%,
        #4e92c8 38%,
        #286294 62%,
        #102d55 100%
    );
}

/* 远处薄云 */
.far-cloud{
    position:absolute;
    left:30%;
    bottom:30%;
    width:520px;
    height:140px;
    opacity:.28;
    filter:blur(20px);
    background:
    radial-gradient(ellipse at 20% 60%,#b5d4e8 0 15%,transparent 16%),
    radial-gradient(ellipse at 45% 40%,#9fc4dc 0 20%,transparent 21%),
    radial-gradient(ellipse at 70% 65%,#86aac8 0 18%,transparent 19%);
}

/* 右下主体碎边体积云 */
.cloud-main{
    position:absolute;
    right:-80px;
    bottom:-120px;
    width:850px;
    height:430px;
    filter:blur(14px);
    background:
    radial-gradient(ellipse at 10% 75%,#16355f 0 18%,transparent 19%),
    radial-gradient(ellipse at 25% 55%,#102b52 0 22%,transparent 23%),
    radial-gradient(ellipse at 40% 72%,#0b2448 0 25%,transparent 26%),
    radial-gradient(ellipse at 55% 45%,#183966 0 24%,transparent 25%),
    radial-gradient(ellipse at 72% 68%,#071c3b 0 32%,transparent 33%),
    radial-gradient(ellipse at 90% 55%,#06172f 0 25%,transparent 26%);
}

/* 碎裂云边小块 */
.cloud-fragments{
    position:absolute;
    right:120px;
    bottom:180px;
    width:420px;
    height:150px;
    filter:blur(10px);
    background:
    radial-gradient(circle at 10% 60%,#244b78 0 10%,transparent 11%),
    radial-gradient(circle at 25% 35%,#294f7b 0 13%,transparent 14%),
    radial-gradient(circle at 43% 65%,#183964 0 12%,transparent 13%),
    radial-gradient(circle at 65% 40%,#214774 0 14%,transparent 15%),
    radial-gradient(circle at 82% 70%,#102d57 0 12%,transparent 13%);
}

/* 一条贴云边晚霞 */
.sunset-line{
    position:absolute;
    left:120px;
    bottom:265px;
    width:360px;
    height:22px;
    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(255,170,120,.75),
        rgba(255,205,160,.65),
        transparent
    );
    filter:blur(8px);
}

/* 微弱空气层 */
.air{
    position:absolute;
    inset:0;
    background:
    linear-gradient(
        120deg,
        transparent 35%,
        rgba(255,255,255,.08),
        transparent 60%
    );
}
</style>
</head>

<body>
<div class="sky">
    <div class="far-cloud"></div>
    <div class="cloud-main"></div>
    <div class="cloud-fragments"></div>
    <div class="sunset-line"></div>
    <div class="air"></div>
</div>
</body>
</html>
